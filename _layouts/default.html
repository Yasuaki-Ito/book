<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark">Y・I</span>
      <span class="brand-name">Yasuaki&nbsp;Ito</span>
    </a>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}">書籍一覧</a>
      <a href="https://forms.gle/EmTWhXoxAEaDB8U3A">お問い合わせ</a>
    </nav>
  </div>
</header>

<main class="container page">
  <article class="prose">
    {{ content }}
  </article>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-brand">Yasuaki Ito — 書籍サポートページ</div>
    <small>&copy; 2026 伊藤 靖朗</small>
  </div>
</footer>
</body>
</html>
